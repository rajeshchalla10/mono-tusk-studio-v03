
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mono Tusk Studios | Palm Sugar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              studio: {
                black: '#0A0A0A',
                charcoal: '#141414',
                accent: '#EC9C1A', 
                emerald: '#004D40', 
                offwhite: '#FDFDFD',
                grey: '#2E2E2E',
                muted: '#888888',
              }
            },
            letterSpacing: {
              'ultra': '0.5em',
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;600;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Native Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0A0A0A;
            color: #FDFDFD;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
            -webkit-overflow-scrolling: touch;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        .pixel-font {
            font-family: 'VT323', monospace;
            text-transform: uppercase;
        }
        
        ::selection {
            background: #EC9C1A;
            color: #0A0A0A;
        }
        
        /* Pixel Grid Overlay */
        .pixel-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0);
            background-size: 4px 4px;
            pointer-events: none;
            z-index: 9998;
            opacity: 0.3;
        }

        .noise-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* RPG Dialogue Box Style */
        .pixel-border {
            border: 4px solid #FDFDFD;
            box-shadow: 
                0 0 0 4px #0A0A0A,
                0 0 0 8px rgba(236, 156, 26, 0.2);
            position: relative;
        }

        .pixel-border-accent {
            border: 2px solid #EC9C1A;
            box-shadow: 2px 2px 0 #0A0A0A, 4px 4px 0 #EC9C1A;
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 99;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0) 0%, rgba(236, 156, 26, 0.03) 50%, rgba(0, 0, 0, 0) 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            pointer-events: none;
            animation: scanline 12s linear infinite;
        }
        
        @keyframes scanline {
            0% { bottom: 110%; }
            100% { bottom: -10%; }
        }

        .dither-overlay {
            mask-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrG+b8ZyADGSADLpAlpEmBAKgB8hCIOgOnExLk99V4WwAAAABJRU5ErkJggg==");
            mask-repeat: repeat;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.29.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="noise-bg"></div>
    <div class="pixel-grid"></div>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
